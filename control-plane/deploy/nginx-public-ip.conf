# Direct public-IP HTTPS reverse proxy.
# Replace <PUBLIC_IP> and certificate paths. The certificate SAN must contain
# the public IP (or use a hostname and its certificate).
# The controller remains on 127.0.0.1:8787.

limit_req_zone $binary_remote_addr zone=ocwd_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ocwd_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=ocwd_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name <PUBLIC_IP>;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name <PUBLIC_IP>;
    server_tokens off;

    ssl_certificate     /etc/ssl/openclaw/fullchain.pem;
    ssl_certificate_key /etc/ssl/openclaw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 256k;
    limit_conn ocwd_conn 12;

    # These endpoints are for the local OpenClaw plugin only. Keeping them out
    # of the public reverse proxy removes an unnecessary Internet attack path.
    location ~ ^/api/(route|policy|tool-check|runtime-status)$ {
        return 404;
    }

    # The browser only reads events. The plugin posts directly to loopback.
    location = /api/events {
        limit_except GET { deny all; }
        limit_req zone=ocwd_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/login {
        limit_req zone=ocwd_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        limit_req zone=ocwd_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
