<section class="page-head"><div><p class="eyebrow">NATIVE PROOF</p><h2>OpenClaw 运行时</h2><p class="muted">这里展示模型、Registry 和真实 hook 证据，不参与日常模式选择。</p></div><span id="runtime-enforcement" class="status-pill warning">ADVISORY</span></section>
