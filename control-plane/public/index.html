<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OpenClaw 委派控制台</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="home">
  <main class="shell">
    <section id="login-view" class="login-card hidden">
      <div class="brand brand-login"><img src="/icon.svg" alt="" width="42" height="42"><div><p class="eyebrow">OPENCLAW CONTROL PLANE</p><h1>委派控制台</h1></div></div>
      <p class="muted">登录后只显示运行控制；诊断、任务和审计已拆分到独立页面。</p>
      <form id="login-form" class="stack">
        <label>控制台密码<input id="password" type="password" autocomplete="current-password" required></label>
        <label id="login-totp-label" class="hidden">动态验证码<input id="login-totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
        <button class="primary" type="submit">登录</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>

    <section id="app-view" class="hidden">
      <header class="topbar">
        <a class="brand" href="/"><img src="/icon.svg" alt="" width="42" height="42"><div><p class="eyebrow">OPENCLAW CONTROL PLANE</p><h1>委派控制台</h1></div></a>
        <nav class="nav" aria-label="控制台导航">
          <a class="active" href="/">控制</a><a href="/tasks.html">任务</a><a href="/runtime.html">运行时</a><a href="/audit.html">审计</a><a href="/settings.html">设置</a>
        </nav>
        <div class="top-actions"><span id="connection" class="status-pill neutral">连接中</span><button id="refresh" class="text-button">刷新</button><button id="logout" class="text-button">退出</button></div>
      </header>

      <section id="enforcement-banner" class="notice warning hidden">
        <strong id="enforcement-state">ADVISORY</strong>
        <span id="enforcement-detail">等待 OpenClaw 原生插件完成路由和工具前置钩子实测。</span>
      </section>

      <section class="hero-row">
        <div>
          <p class="eyebrow">ACTIVE MODE</p>
          <h2 id="resolved-mode" class="mode-title">AUTO</h2>
          <p id="mode-source" class="muted">来源：全局默认</p>
        </div>
        <div class="scope-compact">
          <label>作用范围<select id="scope"><option value="global">全局默认</option><option value="project">当前项目</option><option value="session">当前会话</option><option value="task">下一次任务</option></select></label>
          <label id="scope-id-label" class="hidden">标识<input id="scope-id" placeholder="project / session id" maxlength="200"></label>
        </div>
      </section>

      <section class="mode-grid" aria-label="运行模式">
        <article class="mode-card" data-mode-card="worker">
          <button class="mode-select" data-mode-select="worker" type="button"><span class="mode-index">01</span><span><strong>仅 Worker</strong><small>Main 自主规划、派发与复核；实体工作全部交给 Worker。</small></span><span class="mode-badge">持久</span></button>
          <div class="route-panel" data-route-panel="worker"></div>
        </article>
        <article class="mode-card" data-mode-card="auto">
          <button class="mode-select" data-mode-select="auto" type="button"><span class="mode-index">02</span><span><strong>自动判断</strong><small>轻量问答留在 Main；工具、变更、复杂或不确定任务自动委派。</small></span><span class="mode-badge">推荐</span></button>
          <div class="route-panel" data-route-panel="auto"></div>
        </article>
        <article class="mode-card" data-mode-card="main">
          <button class="mode-select" data-mode-select="main" type="button"><span class="mode-index">03</span><span><strong>仅主控</strong><small>只运行 Main；现有 Worker / Verifier 立即被 lease fence。</small></span><span class="mode-badge danger">提权</span></button>
          <div class="route-panel" data-route-panel="main"></div>
        </article>
      </section>

      <div class="route-savebar">
        <div><strong>OpenClaw 模型路由</strong><span id="registry-note" class="muted">等待 Registry 同步</span></div>
        <button id="save-routing" class="primary" type="button">保存模型路由</button>
      </div>
      <p id="page-message" class="muted page-message" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="main-dialog">
    <form id="main-form" class="dialog-form" method="dialog">
      <p class="eyebrow">PRIVILEGE ELEVATION</p><h2>启用仅主控</h2>
      <p class="muted">这会立即 fence 所有活动 Worker / Verifier。需要重新认证。</p>
      <div class="duration-grid">
        <label><input type="radio" name="main-duration" value="15">15 分钟</label>
        <label><input type="radio" name="main-duration" value="30" checked>30 分钟</label>
        <label><input type="radio" name="main-duration" value="60">60 分钟</label>
        <label><input type="radio" name="main-duration" value="120">120 分钟</label>
        <label class="wide"><input type="radio" name="main-duration" value="0">直到手动切回</label>
      </div>
      <label>控制台密码<input id="reauth-password" type="password" autocomplete="current-password" required></label>
      <label id="reauth-totp-label" class="hidden">动态验证码<input id="reauth-totp" inputmode="numeric" maxlength="6"></label>
      <div class="dialog-actions"><button id="cancel-main" class="secondary" type="button">取消</button><button id="confirm-main" class="danger-button" type="button">确认启用</button></div>
    </form>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
