<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="OpenClaw Control Plane">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="55%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="nodeW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#1f7a3a"/>
    </linearGradient>
    <linearGradient id="nodeM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#b35900"/>
    </linearGradient>
  </defs>
  <!-- iOS rounded square base -->
  <rect x="0" y="0" width="180" height="180" rx="40" ry="40" fill="url(#bg)"/>

  <g transform="translate(90 90)">
    <circle r="12" fill="#ffffff" fill-opacity="0.18"/>
    <circle r="6" fill="#ffffff"/>

    <circle r="46" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-opacity="0.75"/>
    <path d="M 46 0 A 46 46 0 0 1 0 46" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>

    <g transform="rotate(-90) translate(0 -46) rotate(90)">
      <circle r="13" fill="url(#nodeW)"/>
      <circle r="13" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M -5 -3 L -3 3 L -1 -1.5 L 1 3 L 3 -3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="rotate(150) translate(0 -46) rotate(-150)">
      <circle r="13" fill="url(#nodeM)"/>
      <circle r="13" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M -4 3 L -4 -3 L -2 1 L 0 -3 L 2 1 L 4 -3 L 4 3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="rotate(30) translate(0 -46) rotate(-30)">
      <circle r="13" fill="#ffffff"/>
      <circle r="13" fill="none" stroke="#007AFF" stroke-width="1.5"/>
      <path d="M -3.5 3 L -1 -3 L 1.5 3 M -2 1 L 0 1" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>