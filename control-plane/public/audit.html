<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审计 · OpenClaw 委派控制台</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css"></head>
<body data-page="audit"><main class="shell">
<section id="login-view" class="login-card hidden"><div class="brand brand-login"><img src="/icon.svg" alt="" width="42" height="42"><div><p class="eyebrow">OPENCLAW CONTROL PLANE</p><h1>委派控制台</h1></div></div><form id="login-form" class="stack"><label>控制台密码<input id="password" type="password" autocomplete="current-password" required></label><label id="login-totp-label" class="hidden">动态验证码<input id="login-totp" inputmode="numeric" maxlength="6"></label><button class="primary" type="submit">登录</button><p id="login-error" class="error"></p></form></section>
<section id="app-view" class="hidden"><header class="topbar"><a class="brand" href="/"><img src="/icon.svg" alt="" width="42" height="42"><div><p class="eyebrow">OPENCLAW CONTROL PLANE</p><h1>委派控制台</h1></div></a><nav class="nav"><a href="/">控制</a><a href="/tasks.html">任务</a><a href="/runtime.html">运行时</a><a class="active" href="/audit.html">审计</a><a href="/settings.html">设置</a></nav><div class="top-actions"><span id="connection" class="status-pill neutral">连接中</span><button id="refresh" class="text-button">刷新</button><button id="logout" class="text-button">退出</button></div></header>
<section class="page-head"><div><p class="eyebrow">AUDIT LOG</p><h2>控制面审计</h2><p class="muted">路由、模式切换、工具允许/阻断、Worker 生命周期和认证事件统一记录。</p></div><label>数量<select id="audit-limit"><option>100</option><option>250</option><option>500</option></select></label></section>
<section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>时间</th><th>事件</th><th>角色 / Agent</th><th>任务 / Run</th><th>详情</th></tr></thead><tbody id="audit-body"></tbody></table></div></section><p id="page-message" class="muted page-message"></p></section></main><script src="/app.js" defer></script></body></html>
