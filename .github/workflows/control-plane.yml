name: control-plane

on:
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane.yml"
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and package checks
        run: npm run check
      - name: Unit and HTTP integration tests
        run: npm test
      - name: Validate plugin package artifact
        working-directory: control-plane/openclaw-plugin
        run: npm pack --dry-run --json
      - name: Validate example configuration and deploy scripts
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("openclaw-plugin/openclaw.plugin.json", "utf8"))'
          bash -n scripts/validate-deployment.sh
