name: secret-scan

# Secret scanning with gitleaks.
#
# Strategy:
# - Use the official gitleaks action (gitleaks/gitleaks-action), which
#   handles binary download, version pinning, and SARIF upload.
# - On PRs, scan only the diff (`fetch-depth: 0` + the action's default
#   base/head behaviour).
# - On push/schedule, scan the full history.
# - Upload the SARIF to the Security tab on push/schedule runs.
# - The action is widely used and has first-class GitHub support. If it
#   is unreachable for any reason, the workflow fails fast and visibly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly catch-all so secrets pushed outside PRs are still flagged.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history lets gitleaks scan every commit when on push.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin a recent stable v8 release. Override via repo variable
          # GITLEAKS_VERSION when upgrading. The action reads this env var
          # and downloads the matching release.
          GITLEAKS_VERSION: ${{ vars.GITLEAKS_VERSION || '8.18.4' }}
          # Upload SARIF to the Security tab on push/schedule runs.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
